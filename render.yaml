services:
  - type: web
    name: diplom
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "80"

  - type: web
    name: onrender-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: onrender-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@onrender.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTO_SEED_DEMO
        value: "false"

databases:
  - name: onrender-db
    plan: free
    databaseName: kalakutsky_repair
    user: onrender_user
