services:
  - type: web
    name: onrender-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "80"
      - key: API_HOSTPORT
        fromService:
          type: web
          name: onrender-api
          property: hostport

  - type: web
    name: onrender-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: onrender-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: onrender-db
    plan: free
    databaseName: kalakutsky_repair
    user: onrender_user
