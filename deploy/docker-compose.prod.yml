services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: production
    volumes:
      - api_sqlite_data:/app/database

  web:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_HOSTPORT: api:3001
      PORT: 80
    ports:
      - "80:80"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data

  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      APP_URL: ${BESZEL_APP_URL:-http://localhost:8090}
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    profiles:
      - monitoring
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_APP_URL:-http://localhost:8090}
      TOKEN: ${BESZEL_TOKEN:-change-me-after-creating-system-in-beszel}
      KEY: ${BESZEL_KEY:-change-me-after-creating-system-in-beszel}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      start_period: 10s
      timeout: 5s

volumes:
  api_sqlite_data:
  uptime_kuma_data:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
